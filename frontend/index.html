<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1013" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Qwen Chat — Offline</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span id="statusDot" class="dot" title="Local server status"></span>
      <h1>Qwen 2.5 · 1.5B <small id="engineTag">LOCAL</small></h1>
    </div>
    <button id="newChatBtn" aria-label="New chat">＋ New</button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message Qwen…" autocomplete="off"></textarea>
      <button id="sendBtn" aria-label="Send">↑</button>
    </div>
    <p class="hint">100% offline · inference runs on-device</p>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
